{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Passwort zurücksetzen | AV Froburger Intern</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="login-body">
    <main class="login-card">
        <p class="login-card__eyebrow">AV Froburger</p>
        <h1 class="login-card__title">Passwort zurücksetzen</h1>
        <p class="login-card__text">Gib die E-Mail-Adresse deines Kontos ein. Wir senden dir einen Link zum Setzen eines neuen Passworts.</p>
        <form method="post" class="form-stack">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="field">
                <label for="{{ form.email.id_for_label }}">E-Mail-Adresse</label>
                {{ form.email }}
            </div>
            <button type="submit" class="button">Link anfordern</button>
        </form>
        <p class="login-card__text"><a href="{% url 'login' %}" class="text-link">Zurück zur Anmeldung</a></p>
    </main>
</body>
</html>
