{% extends "base.html" %}

{% block page_title %}Passwort ändern{% endblock %}

{% block content %}
<section class="panel panel--narrow">
    <div class="panel__header panel__header--compact">
        <div>
            <p class="section-kicker">Zugang</p>
            <h2>Passwort ändern</h2>
        </div>
    </div>

    <form method="post" class="form-stack password-form">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
        {% include "partials/form_field.html" with field=field %}
        {% endfor %}
        <div class="button-row password-form__actions">
            <button type="submit" class="button">Passwort speichern</button>
            <a href="{% url 'profile-detail' request.user.profile.pk %}" class="button button--ghost">Abbrechen</a>
        </div>
    </form>
</section>
{% endblock %}
