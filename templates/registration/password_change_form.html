{% extends "base.html" %}

{% block page_title %}Passwort ändern{% endblock %}

{% block content %}
<section class="profile-editor">
    <div class="profile-editor__intro">
        <p class="section-kicker">Zugang</p>
        <h2>Passwort ändern</h2>
    </div>
    <form method="post" class="form-stack profile-form">
        {% csrf_token %}
        <div class="profile-form__grid">
            {% include "partials/form_fields.html" with form=form %}
        </div>
        <div class="button-row profile-form__actions">
            <button type="submit" class="button">Passwort speichern</button>
            <a href="{% url 'profile-detail' request.user.profile.pk %}" class="button button--ghost">Abbrechen</a>
        </div>
    </form>
</section>
{% endblock %}
