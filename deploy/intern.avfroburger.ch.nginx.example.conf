server {
    listen 80;
    listen [::]:80;
    server_name intern.avfroburger.ch 179.237.81.250;

    client_max_body_size 25m;

    access_log /var/log/nginx/avf-intern.access.log;
    error_log /var/log/nginx/avf-intern.error.log warn;

    location ~ /\. {
        deny all;
    }

    location /static/ {
        alias /srv/avf-intern/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /media/public/ {
        alias /srv/avf-intern/media/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
