server {
    listen 80;
    listen [::]:80;
    server_name intern.avfroburger.ch 179.237.81.250;

    client_max_body_size 25m;

    access_log /var/log/nginx/avf-intern.access.log;
    error_log /var/log/nginx/avf-intern.error.log warn;

    location ~ /\. {
        deny all;
    }

    location /static/ {
        alias /srv/avf-intern/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # SEC-018: Django's SecurityMiddleware only touches proxied responses -
        # anything nginx serves directly (this location and /media/public/
        # below) needs the same headers added explicitly here. Repeat ALL
        # add_header lines you want on this location if you add more later -
        # nginx does not merge add_header sets across a parent/child context
        # once a child location defines any of its own.
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri =404;
    }

    location /media/public/ {
        alias /srv/avf-intern/media/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri =404;
    }

    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
